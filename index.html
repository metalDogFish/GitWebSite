<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three Block Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1200px;
    }

    .block {
      width: 300px;
      height: 400px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .block:hover {
      transform: translateY(-5px);
    }

    .block-image {
      width: 100%;
      height: 200px;
      background-color: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #999;
    }

    .block-content {
      padding: 20px;
    }

    .block-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .block-description {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="block">
      <div class="block-image">Image Placeholder</div>
      <div class="block-content">
        <div class="block-title">Perlin Flow</div>
        <div class="block-description">Particles tracing paths through a 3D noise field.</div>
      </div>
    </div>

    <div class="block">
      <div class="block-image">Image Placeholder</div>
      <div class="block-content">
        <div class="block-title">Iso-Metric Waves</div>
        <div class="block-description">Oscillating cubic structures in isometric projection.</div>
      </div>
    </div>

    <div class="block">
      <div class="block-image">Image Placeholder</div>
      <div class="block-content">
        <div class="block-title">Neon Chaos</div>
        <div class="block-description">Drifting geometric primitives with motion blur trails.</div>
      </div>
    </div>
  </div>
</body>
</html>
